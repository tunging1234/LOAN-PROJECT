<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貸款試算APP V0.1</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            background-color: #768994;
            color: #070707;
            padding: 24px;
        }

        h1 {
            font-size: 1.6rem;
            color: #063e5f;
            margin-bottom: 1rem;
            text-align: center;
        }

        .contaniner {
            max-width: 900px;
            margin: 0 auto;
        }

        .loan-form,
        .result {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .form-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;

        }

        .form-row label {
            width: 90px;
            color: #063e5f;
            font-weight: bold;
        }

        input[type="number"],
        select {
            padding: 8px 10px;
            border: 1px solid #b0d4ee;
            border-radius: 6px;
            font-size: 1rem;
            width: 180px;

        }

        #clacBtn {
            font-size: 1.2rem;
            padding: 12px;
            margin-top: 20px;
            text-align: center;
            justify-content: center;
            width: 100%;
            color: white;
            background-color: #1707a8;
            border-radius: 6px;
            border: none;
            transition: background-color 1.0s;
        }

        #clacBtn:hover {
            background-color: #8c0aa7c4;
        }

        input[type="radia"] {
            width: 16px;
            height: 16px;
            accent-color: #1707a8;
        }

        .summary-tabel,
        .detail-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 24px;
        }

        .summary-tabel th {
            background-color: #2589c9;
            color: #ffff;
        }

        .summary-tabel th,
        .summary-tabel td {
            border: 1px solid #838e94;
            padding: 10px 12px;
            text-align: left;
        }

        .detail-table th {
            background-color: #0c0c24af;
            color: #ffff;
        }

        .detail-table th,
        .detail-table td {
            border: 1px solid #838e94;
            padding: 10px 10px;
            text-align: center;
        }

        .detail-table tr:nth-child(even) {
            background-color: #bcbec0;
        }

        .summary-tabel td:first-child {
            background-color: cornflowerblue;
        }

        .subtitle {
            font: 0.5rem;
            color: #434d55;
            font-weight: 400;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div class="contaniner">
        <h1>貸款精算助手 <span class="subtitle"> 分析還款計畫</span></h1>

        <hr>
        <form id="loanForm" action="" class="loan-form">
            <div class="form-row">
                <label for="amount">貸款金額</label>
                <input type="number" id="amount" name="amount" value="100" step="10" min="10" required> 萬
            </div>
            <div class="form-row">
                <label for="rate">貸款利率</label>
                <input type="number" id="rate" name="rate" value="1.85" step="0.01" min="1"> %
            </div>

            <div class="form-row">
                <label for="loanYears">貸款年限</label>
                <select name="loanYears" id="loanYears">
                    <option value="3">3</option>
                    <option value="5">5</option>
                    <option value="7" selected>7</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="40">40</option>
                </select> 年
            </div>
            <div class="form-row">
                <label for="repayment">還款方式</label>
                <input type="radio" id="repayment1" name="repayment" value="repaymentMethod1" checked>本息平均攤還
                <input type="radio" id="repayment2" name="repayment" value="repaymentMethod2">本金平均攤還
            </div>
            <button type="button" id="clacBtn">計算</button>

        </form>
        <h2>試算結果</h2>
        <div class="result">


            <!-- 摘要表格 -->
            <table class="summary-tabel">
                <thead>
                    <tr>
                        <th>項目</th>
                        <th>金額</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>每月還款金額</td>
                        <td id="monthlyPayment">--</td>
                    </tr>
                    <tr>
                        <td>總還款金額</td>
                        <td id="totalPayment">--</td>
                    </tr>
                    <tr>
                        <td>總利息支出</td>
                        <td id="totalInterest">--</td>
                    </tr>
                </tbody>
            </table>

            <!-- 分期明細表格 -->
            <table border="1" class="detail-table">
                <thead>
                    <tr>
                        <th>期數</th>
                        <th>月付金額</th>
                        <th>本金</th>
                        <th>利息</th>
                        <th>剩餘本金</th>
                    </tr>
                    <tr>
                        <td>1</td>
                        <td>100000</td>
                        <td>10000000</td>
                        <td>58960</td>
                        <td>12300000</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>100000</td>
                        <td>10000000</td>
                        <td>58960</td>
                        <td>12300000</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>100000</td>
                        <td>10000000</td>
                        <td>58960</td>
                        <td>12300000</td>
                    </tr>
                </thead>
                <tbody id="scheduleBody">
                    <!-- JavaScript 動態填入 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const title = document.querySelector("h1");
        console.log(title);
        title.style.color = "orange";

        //修改內容
        title.innerText = "超級助手!";
        title.innerHTML = "<b>超級助手</b>";

        const amountEl = document.querySelector("#amount");
        const rateEl = document.querySelector("#rate");
        const loanYearsEl = document.querySelector("#loanYears");
        const clacBtnEl = document.querySelector("#clacBtn");


        clacBtn.addEventListener("click", function (e) {
            let amount = amountEl.value;
            let rate = rateEl.value;
            let loanYears = loanYearsEl.value;
            console.log("amount" + amount + rate + loanYears);

            let method = document.querySelector(
                "input[name='repayment']:checked"
            ).value;
            console.log(amount, rate, loanYears, method);
        });



    </script>

</body>

</html>
